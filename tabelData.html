<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />
		<meta
			name="description"
			content="Form Survey Perokok" />
		<title>Data Survey Perokok</title>

		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	</head>
	<body class="flex justify-center h-screen w-screen bg-orange-200">
		<div class="max-w-7xl h-screen flex p-20 my-10 mx-auto flex-col">
			<h1 class="text-4xl font-semibold mb-5 text-center text-black-500">Data Survey Perokok</h1>

			<div class="overflow-x-auto bg-white shadow-md rounded-lg">
				<table class="min-w-5xl text-sm text-center text-white bg-blue-500 border-collapse">
					<thead class="bg-blue-600 text-white">
						<tr>
							<th class="p-3 text-center border-1 border-b-[#dddddd]">No</th>
							<th class="p-3 text-center border-1 border-b-[#dddddd]">Nama</th>
							<th class="p-3 text-center border-1 border-b-[#dddddd]">Umur</th>
							<th class="p-3 text-center border-1 border-b-[#dddddd]">Gender</th>
							<th class="p-3 text-center border-1 border-b-[#dddddd]">Perokok</th>
							<th class="p-3 text-center border-1 border-b-[#dddddd]">Jenis Rokok</th>
						</tr>
					</thead>

					<tbody></tbody>
				</table>
			</div>

			<a
				href="index.html"
				class="w-max no-underline text-lg font-medium cursor-pointer text-white bg-blue-500 hover:bg-blue-600 py-2 px-10 mt-5 rounded-lg">
				Kembali
			</a>
		</div>
		<script>
			const tbody = document.querySelector("tbody");
			const surveys = JSON.parse(localStorage.getItem("data-survey")) || [];

			surveys.forEach((survey, idx) => {
				const tr = document.createElement("tr");
				const col1 = document.createElement("td");
				col1.textContent = idx + 1;
				const col2 = document.createElement("td");
				col2.textContent = survey.fullname;
				const col3 = document.createElement("td");
				col3.textContent = survey.umur;
				const col4 = document.createElement("td");
				col4.textContent = survey.gender;
				const col5 = document.createElement("td");
				col5.textContent = survey.perokok;
				const col6 = document.createElement("td");
				if (survey.jenisRokok.length === 0 || !survey.jenisRokok) {
					col6.textContent = "-";
				}
				col6.textContent = survey.jenisRokok.join(", ");

				tr.append(col1, col2, col3, col4, col5, col6);
				tbody.appendChild(tr);
			});
		</script>
	</body>
</html>
