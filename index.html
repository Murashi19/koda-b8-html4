<!doctype html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0" />

		<link
			rel="preconnect"
			href="https://fonts.googleapis.com" />

		<link
			rel="preconnect"
			href="https://fonts.gstatic.com"
			crossorigin />

		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap"
			rel="stylesheet" />

		<title>Survey Perokok</title>
		<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
	</head>

	<body class="flex justify-center p-5 px-0 h-screen w-screen bg-orange-200">
		<div class="w-3xl">
			<div class="w-3xl bg-white p-10 my-10 mx-auto rounded-lg border-t-10 border-orange-300">
				<h1 class="text-4xl font-semibold mb-5">Survey Perokok</h1>
				<p class="text-gray-500">Silakan isi formulir berikut dengan lengkap.</p>
			</div>

			<form
				action=""
				id="surveyForm"
				class="flex flex-col">
				<!-- Nama -->
				<div class="w-3xl bg-white flex flex-col p-10 mx-auto mb-10 rounded-lg">
					<label
						for="nama"
						class="text-lg font-semibold mb-5"
						>Nama <span class="text-red-500">*</span></label
					>

					<input
						class="w-full p-3 border-b-2 border-gray-400 focus:outline-none focus:border-orange-300"
						type="text"
						name="nama"
						placeholder="Your Answer"
						required />
				</div>

				<!-- Umur -->
				<div class="w-3xl bg-white flex flex-col p-10 mx-auto mb-10 rounded-lg">
					<label
						class="text-lg font-semibold mb-5"
						for="umur"
						>Umur <span class="text-red-500">*</span></label
					>

					<input
						class="w-full p-3 border-b-2 border-gray-400 focus:outline-none focus:border-orange-300"
						type="number"
						name="umur"
						placeholder="Masukkan umur"
						required />
				</div>

				<!-- Jenis Kelamin -->
				<div class="w-3xl bg-white flex flex-col p-10 mx-auto mb-10 rounded-lg">
					<label class="text-lg font-semibold mb-5">Jenis Kelamin <span>*</span></label>

					<div class="flex items-center mb-5 gap-4">
						<input
							class="cursor-pointer"
							type="radio"
							id="gender-l"
							name="gender"
							value="laki-laki"
							checked />

						<label for="gender-l"> Laki-laki </label>
					</div>

					<div class="flex items-center gap-4">
						<input
							class="cursor-pointer"
							type="radio"
							id="gender-p"
							name="gender"
							value="perempuan" />

						<label for="gender-p"> Perempuan </label>
					</div>
				</div>

				<!-- Status Perokok -->
				<div class="w-3xl bg-white flex flex-col p-10 mx-auto mb-10 rounded-lg">
					<label class="text-lg font-semibold mb-5">Apakah anda perokok? <span class="text-red-500">*</span></label>

					<div class="flex items-center mb-5 gap-4">
						<input
							class="cursor-pointer"
							type="radio"
							id="perokok-ya"
							name="perokok"
							value="ya" />

						<label for="perokok-ya"> Ya </label>
					</div>

					<div class="flex items-center gap-4">
						<input
							class="cursor-pointer"
							type="radio"
							id="perokok-tidak"
							name="perokok"
							value="tidak"
							checked />

						<label for="perokok-tidak"> Tidak </label>
					</div>
				</div>

				<!-- Jenis Rokok -->
				<div class="w-3xl bg-white flex flex-col p-10 mx-auto mb-10 rounded-lg">
					<label class="text-lg font-semibold mb-5">Jika anda perokok, rokok apa yang pernah anda coba?</label>

					<div class="flex items-center mb-1 gap-4">
						<input
							class="cursor-pointer"
							type="checkbox"
							id="gg"
							name="jenis_rokok"
							value="Gudang Garam" />

						<label for="gg"> Gudang Garam Filter </label>
					</div>

					<div class="flex items-center mb-1 gap-4">
						<input
							class="cursor-pointer"
							type="checkbox"
							id="ls"
							name="jenis_rokok"
							value="LuckyStrike" />

						<label for="ls"> Lucky Strike </label>
					</div>

					<div class="flex justify-start items-center mb-1 gap-4">
						<input
							class="cursor-pointer"
							type="checkbox"
							id="mb"
							name="jenis_rokok"
							value="Marlboro" />

						<label for="mb"> Marlboro </label>
					</div>

					<div class="flex items-center gap-4">
						<input
							class="cursor-pointer"
							type="checkbox"
							id="es"
							name="jenis_rokok"
							value="Esse" />

						<label for="es"> Esse </label>
					</div>
				</div>

				<div class="flex justify-between items-center w-3xl mx-auto my-0">
					<button
						class="py-2 px-10 border-none rounded-lg bg-orange-400 hover:bg-orange-500 text-white text-sm cursor-pointer"
						type="submit">
						Submit
					</button>
					<button
						class="border-none bg-transparent text-orange-500 font-medium font-(family-name: inherit)"
						type="reset">
						Reset
					</button>
				</div>

				<div class="flex justify-center items-center mb-5">
					<a
						href="tabelData.html"
						class="no-underline text-lg font-medium cursor-pointer text-orange-500"
						>Show Table Result Survey</a
					>
				</div>
			</form>
		</div>
		<script src="app.js"></script>
	</body>
</html>
